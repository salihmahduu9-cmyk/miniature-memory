<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Zayro | Script Shield Dashboard</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --bg-dark: #0a0a12;
            --card-bg: #121225;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--neon-cyan);
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #181830;
            border: 1px solid #333366;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--neon-magenta);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        textarea {
            height: 180px;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--neon-magenta), #bc003f);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background: rgba(0, 255, 100, 0.15);
            color: #00ff64;
            border: 1px solid #00ff64;
        }

        .error {
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-magenta);
            border: 1px solid var(--neon-magenta);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ LORD ZAYRO | SCRIPT SHIELD 🛡️</h1>
    
    <div class="form-group">
        <label for="scriptName">⚙️ اسم السكربت:</label>
        <input type="text" id="scriptName" placeholder="مثال: Blox Fruits Hub">
    </div>

    <div class="form-group">
        <label for="scriptKey">🔑 مفتاح التحقق (Key):</label>
        <input type="text" id="scriptKey" placeholder="أدخل مفتاحاً فريداً لتشغيل السكربت">
    </div>

    <div class="form-group">
        <label for="scriptContent">📜 كود الـ Lua (Script):</label>
        <textarea id="scriptContent" placeholder="قم بلصق كود الـ Lua هنا..."></textarea>
    </div>

    <button onclick="uploadScript()">🚀 تشفير ونشر السكربت آمن</button>

    <div id="statusBox" class="status-msg"></div>
</div>

<script>
    async function uploadScript() {
        const scriptName = document.getElementById('scriptName').value.trim();
        const scriptKey = document.getElementById('scriptKey').value.trim();
        const scriptContent = document.getElementById('scriptContent').value.trim();
        const statusBox = document.getElementById('statusBox');

        if (!scriptName || !scriptKey || !scriptContent) {
            showStatus('يرجى ملء جميع الحقول المطلوبة أولاً!', 'error');
            return;
        }

        showStatus('جاري تشفير وحفظ السكربت سحابياً...', 'success');

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ scriptName, scriptKey, scriptContent })
            });

            const result = await response.json();

            if (response.ok) {
                showStatus(`✅ ${result.message}`, 'success');
                // تنظيف الحقول بعد النجاح
                document.getElementById('scriptName').value = '';
                document.getElementById('scriptKey').value = '';
                document.getElementById('scriptContent').value = '';
            } else {
                showStatus(`❌ خطأ: ${result.error}`, 'error');
            }
        } catch (err) {
            showStatus('❌ فشل الاتصال بالخادم، تأكد من تشغيل الـ Backend!', 'error');
        }
    }

    function showStatus(msg, type) {
        const statusBox = document.getElementById('statusBox');
        statusBox.textContent = msg;
        statusBox.className = `status-msg ${type}`;
        statusBox.style.display = 'block';
    }
</script>

</body>
</html>
